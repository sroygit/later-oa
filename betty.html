<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
<style>
  :root {
    --line: #e2e2e6; --bg: #fff; --ink: #1b1b1f; --mute: #6b6b74; --accent: #2d5bd7;
    --kickoff: #6b6b74; --wip: #2d5bd7; --blocked: #c23b32; --wrapped: #2e7d4f; --dropped: #9a9aa2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 18px;
    padding: 14px 22px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  nav button {
    border: 0; background: none; font: inherit; color: var(--mute);
    padding: 4px 2px; cursor: pointer; border-bottom: 2px solid transparent;
  }
  nav button.on { color: var(--ink); border-bottom-color: var(--accent); }
  #err {
    display: none; margin: 0; padding: 9px 22px; background: #fdecea;
    color: #8c2b24; border-bottom: 1px solid #f3c9c4; font-size: 14px;
  }
  main { padding: 18px 22px 60px; }
  .cols { display: flex; gap: 28px; align-items: flex-start; }
  .side { flex: 0 0 260px; }
  .body { flex: 1; min-width: 0; }
  h2 { font-size: 16px; margin: 0 0 2px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
       color: var(--mute); margin: 26px 0 8px; font-weight: 600; }
  .mute { color: var(--mute); font-size: 13px; }
  ul.plist { list-style: none; margin: 0; padding: 0; }
  ul.plist button {
    width: 100%; text-align: left; border: 0; background: none; font: inherit;
    padding: 7px 9px; border-radius: 6px; cursor: pointer;
    display: flex; justify-content: space-between; gap: 8px; align-items: center;
  }
  ul.plist button:hover { background: #f4f4f7; }
  ul.plist button.on { background: #ecf0fb; color: var(--accent); font-weight: 600; }
  ul.plist span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill {
    font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600;
    color: #fff; background: var(--kickoff); border-radius: 10px; padding: 2px 7px; white-space: nowrap;
  }
  .s-kickoff { background: var(--kickoff); } .s-wip { background: var(--wip); }
  .s-blocked { background: var(--blocked); } .s-wrapped { background: var(--wrapped); }
  .s-dropped { background: var(--dropped); }
  input, select, textarea, button.btn { font: inherit; color: inherit; }
  input, select, textarea {
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: #fff;
  }
  textarea { resize: vertical; }
  button.btn {
    border: 1px solid var(--line); background: #f7f7f9; border-radius: 6px;
    padding: 6px 12px; cursor: pointer;
  }
  button.btn:hover { background: #ededf1; }
  button.btn.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.go:hover { background: #2449ad; }
  button.x {
    border: 0; background: none; color: var(--mute); cursor: pointer;
    font-size: 15px; padding: 2px 6px; border-radius: 4px;
  }
  button.x:hover { background: #fdecea; color: var(--blocked); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--mute); font-weight: 600; }
  td.num, th.num { text-align: right; padding-right: 18px; }
  .todo td:first-child { width: 26px; padding-right: 0; }
  .todo td:last-child { width: 32px; text-align: right; padding-right: 0; }
  .done { color: var(--mute); text-decoration: line-through; }
  .late { color: var(--blocked); }
  .flag { color: var(--blocked); font-weight: 600; }
  details.new { margin-top: 18px; }
  details.new summary { cursor: pointer; color: var(--accent); font-size: 14px; }
  .form { display: grid; gap: 7px; margin-top: 10px; }
  .row { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .row input[name=task] { flex: 1 1 220px; }
  .hide { display: none; }
</style>
</head>
<body>
<header>
  <h1>Projects</h1>
  <nav>
    <button id="tab-p" class="on" onclick="show('p')">Projects</button>
    <button id="tab-s" onclick="show('s')">Portfolio</button>
  </nav>
  <span class="mute" id="stamp" style="margin-left:auto"></span>
</header>
<p id="err"></p>

<main>
  <section id="view-p">
    <div class="cols">
      <div class="side">
        <ul class="plist" id="plist"></ul>
        <details class="new">
          <summary>New project</summary>
          <div class="form">
            <input id="n-title" placeholder="Title">
            <textarea id="n-desc" rows="2" placeholder="Description"></textarea>
            <select id="n-status"></select>
            <button class="btn go" onclick="createProject()">Create</button>
          </div>
        </details>
      </div>
      <div class="body" id="detail"></div>
    </div>
  </section>

  <section id="view-s" class="hide">
    <table id="summary"></table>
    <h3 id="late-head">Overdue todos</h3>
    <table id="late"></table>
  </section>
</main>

<script>
const STATUSES = ["kickoff", "wip", "blocked", "wrapped", "dropped"];
let projects = [], picked = null, tab = "p";

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const pill = s => `<span class="pill s-${esc(s)}">${esc(s || "?")}</span>`;

function fail(msg) {
  const e = $("err");
  if (!msg) { e.style.display = "none"; return; }
  e.textContent = msg;
  e.style.display = "block";
}

async function call(method, path, body) {
  const opt = { method };
  if (body !== undefined) {
    opt.headers = { "Content-Type": "application/json" };
    opt.body = JSON.stringify(body);
  }
  const r = await fetch(path, opt);
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (_) { data = null; }
  if (!r.ok) throw new Error((data && (data.detail || data.error)) || text || ("HTTP " + r.status));
  return data;
}

// run an action, then reload; keeps one error surface for everything
async function act(fn) {
  fail("");
  try { await fn(); await load(); }
  catch (e) { fail(e.message); }
}

function show(which) {
  tab = which;
  for (const t of ["p", "s"]) {
    $("tab-" + t).classList.toggle("on", t === which);
    $("view-" + t).classList.toggle("hide", t !== which);
  }
  if (which === "s") loadSummary();
}

async function load() {
  projects = await call("GET", "/ui/projects");
  if (!projects.some(p => p.id === picked)) picked = projects.length ? projects[0].id : null;
  drawList();
  drawDetail();
  $("stamp").textContent = projects.length + " projects";
  if (tab === "s") loadSummary();
}

function drawList() {
  $("plist").innerHTML = projects.map(p => `
    <li><button class="${p.id === picked ? "on" : ""}" onclick="pick('${p.id}')">
      <span class="t">${esc(p.title)}</span>${pill(p.status)}
    </button></li>`).join("") || `<li class="mute">No projects yet.</li>`;
}

function pick(id) { picked = id; drawList(); drawDetail(); }

function drawDetail() {
  const p = projects.find(x => x.id === picked);
  if (!p) { $("detail").innerHTML = `<p class="mute">Pick a project, or create one.</p>`; return; }
  const items = p.items.slice().sort((a, b) => (a.done - b.done) || String(a.due).localeCompare(String(b.due)));
  const rows = items.map(t => `
    <tr class="todo">
      <td><input type="checkbox" ${t.done ? "checked" : ""}
           onchange="markTodo('${p.id}','${t.id}', this.checked)"></td>
      <td class="${t.done ? "done" : ""}">${esc(t.task)}</td>
      <td class="mute">${esc(t.who || "unassigned")}</td>
      <td class="mute ${!t.done && t.due && t.due < today() ? "late" : ""}">${esc(t.due || "—")}</td>
      <td><button class="x" title="Delete" onclick="delTodo('${p.id}','${t.id}')">&times;</button></td>
    </tr>`).join("");

  $("detail").innerHTML = `
    <h2>${esc(p.title)}</h2>
    <p class="mute">${esc(p.id)} &middot; updated ${esc(p.updated || "—")}</p>
    <div class="row">
      <select id="st">${STATUSES.map(s =>
        `<option ${s === p.status ? "selected" : ""}>${s}</option>`).join("")}</select>
      <button class="btn" onclick="saveStatus('${p.id}')">Save status</button>
    </div>
    ${p.description ? `<p>${esc(p.description)}</p>` : ""}
    <h3>Todos (${items.filter(t => !t.done).length} open / ${items.length})</h3>
    <table>
      ${items.length ? `<tbody>${rows}</tbody>` : `<tr><td class="mute">No todos yet.</td></tr>`}
    </table>
    <div class="row">
      <input name="task" id="t-task" placeholder="Task">
      <input id="t-who" placeholder="Who" size="12">
      <input id="t-due" type="date">
      <button class="btn go" onclick="addTodo('${p.id}')">Add todo</button>
    </div>`;
}

function createProject() {
  const title = $("n-title").value.trim();
  if (!title) { fail("Title is required."); return; }
  act(async () => {
    const made = await call("POST", "/ui/projects",
      { title, description: $("n-desc").value, status: $("n-status").value });
    picked = made.id;
    $("n-title").value = ""; $("n-desc").value = "";
  });
}

const saveStatus = pid => act(() => call("POST", `/ui/projects/${pid}/status`, { status: $("st").value }));
const markTodo = (pid, tid, done) => act(() => call("POST", `/ui/projects/${pid}/todos/${tid}/done`, { done }));
const delTodo = (pid, tid) => act(() => call("DELETE", `/ui/projects/${pid}/todos/${tid}`));

function addTodo(pid) {
  const task = $("t-task").value.trim();
  if (!task) { fail("Task is required."); return; }
  act(() => call("POST", `/ui/projects/${pid}/todos`,
    { task, who: $("t-who").value, due: $("t-due").value || null }));
}

async function loadSummary() {
  fail("");
  try {
    const s = await call("GET", "/ui/summary");
    $("summary").innerHTML = `
      <thead><tr>
        <th>Project</th><th>Status</th><th class="num">Open</th><th class="num">Done</th>
        <th class="num">Overdue</th><th>Updated</th><th>Changed this week</th><th>Stuck</th>
      </tr></thead>
      <tbody>${s.rows.map(r => `<tr>
        <td>${esc(r.title)}</td>
        <td>${pill(r.status)}</td>
        <td class="num">${r.open}</td>
        <td class="num">${r.done}</td>
        <td class="num ${r.overdue ? "flag" : ""}">${r.overdue}</td>
        <td class="mute">${esc(r.updated_at || "—")}</td>
        <td>${r.changed_this_week ? "yes" : ""}</td>
        <td class="flag">${r.stuck ? "stuck" : ""}</td>
      </tr>`).join("")}</tbody>`;
    $("late-head").textContent = `Overdue todos (${s.overdue.length})`;
    $("late").innerHTML = s.overdue.length
      ? `<thead><tr><th>Task</th><th>Who</th><th>Due</th><th>Project</th></tr></thead>
         <tbody>${s.overdue.map(t => `<tr>
           <td>${esc(t.task)}</td>
           <td class="mute">${esc(t.who || "unassigned")}</td>
           <td class="late">${esc(t.due || "—")}</td>
           <td class="mute">${esc(t.project_title)}</td>
         </tr>`).join("")}</tbody>`
      : `<tr><td class="mute">Nothing overdue.</td></tr>`;
  } catch (e) { fail(e.message); }
}

$("n-status").innerHTML = STATUSES.map(s => `<option>${s}</option>`).join("");
load().catch(e => fail(e.message + " — is the shim running? .venv/bin/uvicorn webhook:app --port 8787"));
</script>
</body>
</html>
